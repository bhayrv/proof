[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-protocol"
version = "0.2.0"
description = "An open protocol for machine-readable claims, evidence, attestations, and verification."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "PROOF Contributors"}
]
dependencies = [
    "cryptography>=50.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "jsonschema>=4.20"
]

[project.scripts]
proof = "proof.cli:main"

[tool.setuptools.packages.find]
include = ["proof*"]
exclude = ["tests*", "spec*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]